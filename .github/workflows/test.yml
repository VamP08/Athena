name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (zero findings enforced)
        run: pipx run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Never trace CI runs — mocked tests are noise and burn the free quota
      LANGCHAIN_TRACING_V2: "false"
      MCP_MODE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock

      - name: Run test suite (mocked — no network, no LLM)
        run: pytest tests/ -v --tb=short
