[theme]
base = "dark"
primaryColor = "#E3A94F"
backgroundColor = "#0D1014"
secondaryBackgroundColor = "#151A21"
textColor = "#E7E9EC"
linkColor = "#E3A94F"
borderColor = "#262C36"
baseRadius = "medium"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Streamlit's own transport cap. The session store enforces its per-chat
# limits after parsing; this stops a 200 MB default upload before it ships.
maxUploadSize = 25
