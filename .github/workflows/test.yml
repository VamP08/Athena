name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Never trace CI runs — mocked tests are noise and burn the free quota
      LANGCHAIN_TRACING_V2: "false"
      MCP_MODE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (mocked — no network, no LLM)
        run: pytest tests/ -v --tb=short
